<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Plan Paciente</title>
</head>
<body>

<div style="text-align:center; font-weight:bold;">PATIENT CARE</div>

<div style="background:#004080; color:white; padding:8px; text-align:center;">
    <span th:text="${session.usuarioId}">USUARIO</span>
    &nbsp;|&nbsp;
    <a href="/logout" style="color:white;">LOGOUT</a>
</div>

<h2 style="color:orange; text-align:center;">
    Farmacia: &nbsp;
    <span th:if="${farmacia != null}" th:text="${farmacia.nombre}"></span>
</h2>

<!-- Búsqueda de paciente -->
<div style="text-align:center; margin:10px;">
    <form action="/presentation/plan/refrescar" method="get">
        <label style="color:orange;"><b>Paciente:</b></label>
        <input type="text" name="pacienteId" th:value="${pacienteId}" />
        <button type="submit">Buscar</button>
        <span th:if="${paciente != null}" th:text="${paciente.nombre}" style="margin-left:10px;"></span>
        <span th:if="${errorPaciente != null}" th:text="${errorPaciente}" style="color:red; margin-left:10px;"></span>
    </form>
</div>

<div th:if="${medicamentos != null}" style="text-align:center; margin:10px;">

    <div th:if="${errorEntrega != null}" style="color:red;" th:text="${errorEntrega}"></div>



    <form action="/presentation/plan/medicamento/registrar" method="post">
        <input type="hidden" name="pacienteId" th:value="${pacienteId}" />

        <label style="color:orange;"><b>Medicamento:</b></label>
        <select name="pmId" id="pmId">
            <option th:each="pm : ${medicamentos}"
                    th:value="${pm.id}"
                    th:text="${pm.medicamento.nombre}
                              + ' (' + ${pm.medicamento.plan} + ' + 1) '
                              + '[' + ${pm.dosisafavor} + ']'">
            </option>
        </select>

        <label><b>Cant. Dosis:</b></label>
        <input type="number" name="cantidad" value="1" min="1" style="width:60px;" />
        <button type="submit">Registrar</button>
    </form>

    <form action="/presentation/plan/medicamento/entregar" method="post">
        <input type="hidden" name="pacienteId" th:value="${pacienteId}" />
        <select name="pmId">
            <option th:each="pm : ${medicamentos}"
                    th:value="${pm.id}"
                    th:text="${pm.medicamento.nombre}
                              + ' (' + ${pm.medicamento.plan} + ' + 1) '
                              + '[' + ${pm.dosisafavor} + ']'">
            </option>
        </select>
        <button type="submit">Entregar</button>
    </form>

</div>

<div style="text-align:center; margin-top:40px; font-size:12px;">
    Todos los derechos reservados . 2026 . TotalSoft Inc. info@tsinc.com
</div>

</body>
</html>
